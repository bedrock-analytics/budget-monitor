# Default values for charts.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
environment: dev

image:
  repository: 309100466116.dkr.ecr.ap-southeast-1.amazonaws.com/subsea-x-app
  tag: dev-latest
  pullPolicy: IfNotPresent
  port:
    - name: app
      port: 3000
      # https://github.com/kubernetes/enhancements/tree/master/keps/sig-network/1507-app-protocol
      appProtocol: http



env:
      - name: AWS_REGION
        valueFrom:
            configMapKeyRef:
                name: subsea-x-app
                key: AWS_REGION
      - name: KB_ID
        valueFrom:
            secretKeyRef:
                name: subsea-x-app
                key: KB_ID
      - name: NEXTAUTH_SECRET
        valueFrom:
            secretKeyRef:
                name: subsea-x-app
                key: NEXTAUTH_SECRET
      - name: COGNITO_CLIENT_ID
        valueFrom:
            secretKeyRef:
                name: subsea-x-app
                key: COGNITO_CLIENT_ID
      - name: COGNITO_CLIENT_SECRET
        valueFrom:
            secretKeyRef:
                name: subsea-x-app
                key: COGNITO_CLIENT_SECRET
      - name: COGNITO_ISSUER
        valueFrom:
            configMapKeyRef:
                name: subsea-x-app
                key: COGNITO_ISSUER
      - name: DATABASE_URL
        valueFrom:
            configMapKeyRef:
                name: subsea-x-app
                key: DATABASE_URL
      - name: NEXTAUTH_URL
        valueFrom:
            configMapKeyRef:
                name: subsea-x-app
                key: NEXTAUTH_URL
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
            secretKeyRef:
                name: subsea-x-app
                key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
            secretKeyRef:
                name: subsea-x-app
                key: AWS_SECRET_ACCESS_KEY






serviceAccount:
    create: true
    annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::174466744028:role/xspector-dev-s3-fullaccess
    name: 'x-app'
